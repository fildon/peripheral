<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peripheral Voronoi Camera</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Peripheral</h1>
      <p>
        Live webcam effect with center-preserving detail and reduced peripheral
        resolution.
      </p>

      <section id="feedSection">
        <canvas id="view" aria-label="Processed webcam feed"></canvas>
        <video id="sourceVideo" playsinline autoplay muted></video>
        <div class="status-row">
          <span id="cameraStatus">Camera: idle</span>
          <span id="fpsStatus">FPS: --</span>
          <span id="resolutionStatus">Resolution: --</span>
        </div>
      </section>

      <section aria-label="Effect controls">
        <div class="button-row">
          <button id="fullscreenBtn" type="button">Fullscreen</button>
          <button id="resetBtn" type="button">Reset Defaults</button>
        </div>

        <div class="controls-grid">
          <label>
            <span>Seed Count</span>
            <output id="seedCountValue">900</output>
            <input
              id="seedCount"
              type="range"
              min="300"
              max="3600"
              step="20"
              value="900"
            />
          </label>

          <label>
            <span>Center Radius</span>
            <output id="centerRadiusValue">200</output>
            <input
              id="centerRadius"
              type="range"
              min="70"
              max="500"
              step="5"
              value="200"
            />
          </label>

          <label>
            <span>Falloff Width</span>
            <output id="falloffValue">260</output>
            <input
              id="falloff"
              type="range"
              min="80"
              max="700"
              step="5"
              value="260"
            />
          </label>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
